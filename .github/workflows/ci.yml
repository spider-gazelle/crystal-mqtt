name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crystal:
          - latest
          - nightly
    runs-on: ${{ matrix.os }}
    container: crystallang/crystal:${{ matrix.crystal }}-alpine
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    - name: Run tests
      run: crystal spec -v --error-trace

  lint:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest-alpine
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    - name: Format
      run: crystal tool format --check
    # `shards install` does not build targets, ameba has to be built explicitly
    - name: Build ameba
      run: shards build ameba
    - name: Lint
      run: ./bin/ameba

  live-broker:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest-alpine
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    # a service container cannot be given a config file or a command override,
    # and mosquitto 2.x refuses anonymous clients without one. `./test` starts
    # the broker itself, so CI and a laptop run exactly the same path
    - name: Install mosquitto
      run: apk add --no-cache mosquitto bash
    # retained message persistence is broker side, so it only means anything
    # when tested against a real one
    - name: Run the end to end suite
      run: ./test

  multithreaded:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest-alpine
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: shards install --ignore-crystal-version
    # the client is driven from several fibers, so the locking has to hold up
    # when those fibers are genuinely running in parallel
    - name: Run tests (preview_mt)
      run: crystal spec -v --error-trace -Dpreview_mt
      env:
        CRYSTAL_WORKERS: 4
