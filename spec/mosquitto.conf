# Broker used by the end to end specs, by `./test` and by CI.
# mosquitto 2.x listens on localhost only and denies anonymous clients by
# default, so both have to be set explicitly.
listener 1883 0.0.0.0
allow_anonymous true

# retained messages only need to outlive a connection, not the broker
persistence false

# The 5.0 specs assert on what the CONNACK negotiates, and the defaults differ
# between the eclipse-mosquitto image used locally and the alpine package used
# in CI. Pinning them keeps both environments telling the client the same thing.
max_packet_size 2000000
max_inflight_messages 20
max_topic_alias 10
